explainer:
  what: The yield on a 10-year Government of Canada bond.
  why_it_matters: A long-term benchmark for borrowing costs and growth and inflation expectations. It
    co-moves strongly with the US 10-year yield.
  how_to_read: Compare it with the 2-year yield. A flat or inverted gap has historically signalled a slowing
    economy.

explainer:
  what: The Bank of Canada's estimate of the average variable mortgage rate, based on broker data.
  why_it_matters: It shows what variable-rate borrowers are actually paying, which is closer to reality
    than the posted fixed rate.
  how_to_read: Compare it with the policy rate and prime. Spreads to prime shift with competition.

id: boc.mortgage_5y_posted
title: Conventional mortgage rate, 5-year (posted)
source: boc_valet
source_id: V80691335
frequency: weekly
unit: percent
geography: Canada
layer: rates_credit
explainer:
  what: The posted 5-year fixed conventional mortgage rate of the major chartered banks. Posted rates
    are list prices.
  why_it_matters: Buyers rarely pay the posted rate. It is still useful as a stable, official benchmark
    that moves with the 5-year bond yield, and it is the reference for some qualification rules.
  how_to_read: Treat it as a ceiling, not a quote. Actual discounted 5-year fixed rates are usually well
    below it. Compare changes, not the level.
  moves_with:
  - boc.gov_5y_yield
licence_note: Bank of Canada terms apply (https://www.bankofcanada.ca/terms/). Not yet reviewed for hosting.
  No official series exists for the typical discounted 5-year fixed rate. See docs/DATA_SOURCES.md open
  items.
verified_on: '2026-10-14'

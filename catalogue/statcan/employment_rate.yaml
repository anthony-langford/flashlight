frequency: monthly
unit: percent
geography: Toronto CMA
layer: demand
seasonal_adj: true
explainer:
  what: The share of the working-age population in Toronto that has a job.
  why_it_matters: It captures job availability better than the unemployment rate because it is not affected
    by people leaving the labour force.
  how_to_read: Compare with its own history. Falling employment rate with a flat unemployment rate suggests
    discouraged workers.

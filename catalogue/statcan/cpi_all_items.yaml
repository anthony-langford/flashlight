layer: canada_macro
explainer:
  what: The price level of a basket of everyday goods and services in Toronto. An index level, not an
    inflation rate.
  why_it_matters: Local inflation affects the cost of living and the budget left for a mortgage.
  how_to_read: Compute the year-over-year change from the index. The app should derive it.
